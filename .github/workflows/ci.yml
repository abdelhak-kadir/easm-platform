name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements/base.txt
          pip install -r requirements/tools.txt
          pip install -r requirements/dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: black --check .
      - name: Test
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
        run: pytest --cov=backend --cov-report=term --cov-report=html -v --timeout=60 --maxfail=5

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build base image
        run: docker build -f docker/base.Dockerfile -t easm-base:latest .

      - name: Build app image
        run: docker build -f docker/app.Dockerfile -t easm-app:ci .
